name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını hazırla
        run: node prepare-web.js

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: APK derle
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kisisel-Finans.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kisisel-Finans-APK
          path: Kisisel-Finans.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kişisel Finans v${{ github.run_number }}
          files: Kisisel-Finans.apk
